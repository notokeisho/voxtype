services:
  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:2026.1.2
    command: tunnel run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  # Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      admin-web:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      - INITIAL_ADMIN_GITHUB_ID=${INITIAL_ADMIN_GITHUB_ID}
      - INITIAL_ADMIN_GITHUB_USERNAME=${INITIAL_ADMIN_GITHUB_USERNAME}
      - WHISPER_SERVER_URL_FAST=http://whisper-fast:8080
      - WHISPER_SERVER_URL_SMART=http://whisper-smart:8080
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-ja}
      - VAD_ENABLED=${VAD_ENABLED:-true}
      - VAD_SPEECH_THRESHOLD=${VAD_SPEECH_THRESHOLD:-0.3}
      - RMS_SILENCE_THRESHOLD=${RMS_SILENCE_THRESHOLD:-0.005}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-https://voxtype-admin.oshiruko.dev}
      - OAUTH_CALLBACK_ALLOWLIST=${OAUTH_CALLBACK_ALLOWLIST:-voxtype://callback,https://voxtype-admin.oshiruko.dev/auth/callback}
      - APP_NAME=${APP_NAME:-VoxType}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      whisper-fast:
        condition: service_healthy
      whisper-smart:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /api/status also probes both whisper servers with a 5s timeout each,
      # so the check itself needs more room than the request it replaces.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/status | grep -q '\"database\":\"connected\"'"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-voxtype}
      - POSTGRES_USER=${POSTGRES_USER:-voxtype}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxtype} -d ${POSTGRES_DB:-voxtype}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Whisper Speech Recognition - Fast (GPU, small model)
  # This service owns the build. whisper-smart runs the same image with a
  # different model, so building it twice would compile CUDA twice, in
  # parallel, and exhaust the machine.
  whisper-fast:
    image: voxtype-whisper-gpu:local
    build:
      context: ./whisper
      dockerfile: Dockerfile.gpu
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
    environment:
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-ja}
      - WHISPER_MODEL=/app/models/ggml-small.bin
      - ENABLE_VAD=false
    expose:
      - "8080"
    volumes:
      - ./whisper/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Whisper Speech Recognition - Smart (GPU, medium model)
  # Runs the image built by whisper-fast. Compose builds that image before it
  # resolves this one, so `up` on its own still works.
  whisper-smart:
    image: voxtype-whisper-gpu:local
    environment:
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-ja}
      - WHISPER_MODEL=/app/models/ggml-medium.bin
      - ENABLE_VAD=false
    expose:
      - "8080"
    volumes:
      - ./whisper/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Admin Web UI
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://voxtype.oshiruko.dev}
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
