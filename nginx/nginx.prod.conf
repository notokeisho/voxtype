events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Every request arrives from the cloudflared container, so the peer
    # address is the same for all users. Take the client address from
    # Cloudflare's header instead, and only from the internal Docker ranges.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Rate limiting, keyed on the real client address
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream servers
    upstream api_server {
        server server:8000;
    }

    upstream admin_web {
        server admin-web:80;
    }

    # API Server (voxtype.oshiruko.dev)
    server {
        listen 80;
        server_name voxtype.oshiruko.dev;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API endpoints
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Timeout for audio uploads. Transcription of a 60s recording
            # takes a few seconds on GPU, but queues behind other requests.
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Body size for audio files. A 60s 16kHz mono 16-bit recording is
            # about 2MB, so 20M leaves room without inviting large uploads.
            client_max_body_size 20M;
        }
    }

    # Admin Web (voxtype-admin.oshiruko.dev)
    server {
        listen 80;
        server_name voxtype-admin.oshiruko.dev;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://admin_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Default server (reject unknown hosts)
    server {
        listen 80 default_server;
        server_name _;

        # Endpoint for the container healthcheck, which has no Host header
        # matching the public names.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # A return at server level runs in the rewrite phase, before locations
        # are matched, so it would also answer /healthz. Keep it in a location.
        location / {
            return 444;
        }
    }
}
